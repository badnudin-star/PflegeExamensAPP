name: Deploy Quiz-Ranking Worker (vorbereitet)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ich bestätige die gesondert freigegebene Bereitstellung der Quiz-Rangliste'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No automatic deploy on pushes, even if the repository variable is enabled.
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_QUIZ_RANKING_DEPLOY == 'true' && inputs.confirm == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "cloudflare-ranking"
