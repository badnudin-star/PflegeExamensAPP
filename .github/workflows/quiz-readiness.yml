name: Tagesquiz-Konfiguration schreibgeschützt prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    name: Konfiguration ohne Übertragung prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Nur freigegebenen Standardbranch zulassen
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo '::error::Die Konfigurationsprüfung darf nur auf main laufen.'
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Nur Vorhandensein der Einstellungen prüfen
        env:
          ENABLED: ${{ vars.QUIZ_GENERATION_ENABLED }}
          NO_BILLING_VERIFIED: ${{ vars.GEMINI_NO_BILLING_VERIFIED }}
          FOLDER: ${{ vars.LEARNING_DRIVE_FOLDER_ID }}
          MODEL: ${{ vars.GEMINI_MODEL }}
          GOOGLE_CREDS: ${{ secrets.LEARNING_DRIVE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/daily_quiz/check_readiness.py
