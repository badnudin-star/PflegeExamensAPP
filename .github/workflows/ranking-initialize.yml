name: Separate Ranglisten-D1 initialisieren
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Schema nur in der ausdrücklich neu angelegten, leeren Ranking-D1 einrichten'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ranking-initialize
  cancel-in-progress: false
jobs:
  initialize:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Schutzlogik prüfen
        run: python -m unittest discover -s tools/cloudflare_checks -p 'test_ranking_initialize.py' -v
      - name: Nur nach Identitäts- und Leerheitsprüfung initialisieren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RANKING_CONFIRM: ${{ inputs.confirm }}
        run: python tools/cloudflare_checks/ranking_initialize.py
