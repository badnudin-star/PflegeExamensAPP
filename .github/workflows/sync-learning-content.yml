name: Lernzettel aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: learning-content-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Konfiguration prüfen
        id: configured
        env:
          URL: ${{ vars.CONTENT_WORKER_ORIGIN }}
          FOLDER: ${{ vars.LEARNING_DRIVE_FOLDER_ID }}
          GOOGLE_CREDS: ${{ secrets.LEARNING_DRIVE_CREDENTIALS }}
          PUBLISH_TOKEN: ${{ secrets.CONTENT_PUBLISH_TOKEN }}
        run: |
          if [ -n "$URL" ] && [ -n "$FOLDER" ] && [ -n "$GOOGLE_CREDS" ] && [ -n "$PUBLISH_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Automatischer Import nicht konfiguriert; keine Veröffentlichung.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'
      - uses: actions/setup-python@v6
        if: steps.configured.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        if: steps.configured.outputs.ready == 'true'
        run: pip install -r tools/learning_import/requirements.txt
      - name: Drive prüfen und Katalog veröffentlichen
        if: steps.configured.outputs.ready == 'true'
        env:
          GOOGLE_CREDS: ${{ secrets.LEARNING_DRIVE_CREDENTIALS }}
          CONTENT_PUBLISH_TOKEN: ${{ secrets.CONTENT_PUBLISH_TOKEN }}
          CONTENT_WORKER_ORIGIN: ${{ vars.CONTENT_WORKER_ORIGIN }}
          LEARNING_DRIVE_FOLDER_ID: ${{ vars.LEARNING_DRIVE_FOLDER_ID }}
        run: |
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/learning-drive-credentials.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$GOOGLE_CREDS" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset GOOGLE_CREDS
          python tools/learning_import/sync_drive.py --folder "$LEARNING_DRIVE_FOLDER_ID" --worker "$CONTENT_WORKER_ORIGIN"
