name: Produktiven Ranking-Sicherungspfad lesend prüfen
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Produktive Ranglistendaten kurz im Runner-Speicher lesen und temporär verschlüsselt prüfen; kein Backup behalten'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verschlüsselungsabhängigkeit installieren
        run: python -m pip install -r tools/cloudflare_checks/requirements-backup.txt
      - name: Schutzlogik testen
        run: |
          python -m unittest discover -s tools/cloudflare_checks -p 'test_ranking_backup.py' -v
          python -m unittest discover -s tools/cloudflare_checks -p 'test_ranking_backup_live_probe.py' -v
      - name: Ausschließlich lesend prüfen, kein Artifact erzeugen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_BACKUP_PROBE_CONFIRM: ${{ inputs.confirm }}
        run: python tools/cloudflare_checks/ranking_backup_live_probe.py
