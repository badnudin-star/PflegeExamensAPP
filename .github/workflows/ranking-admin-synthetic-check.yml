name: Administrative Ranking-Löschung isoliert testen
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Nur synthetische Konten in der gesonderten Restore-Test-D1 erstellen und löschen'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Schutzlogik und synthetische Löschung prüfen
        run: python -m unittest discover -s tools/cloudflare_checks -p 'test_ranking_admin_delete.py' -v
      - name: Ausschließlich auf synthetischer Test-D1 prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TEST_CONFIRM: ${{ inputs.confirm }}
        run: python tools/cloudflare_checks/ranking_admin_delete_synthetic.py
