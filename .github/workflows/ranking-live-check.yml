name: Ranglisten-Dienst nach Bereitstellung prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prüflogik testen
        run: python -m unittest discover -s tools/cloudflare_checks -p 'test_ranking_live_probe.py' -v
      - name: Bindings und öffentliche Leseendpunkte prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/cloudflare_checks/ranking_live_probe.py
