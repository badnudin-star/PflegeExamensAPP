name: Ranglisten-Worker erstmalig bereitstellen
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Erstmalige öffentliche Bereitstellung des Ranking-Workers bestätigen'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ranking-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Vorprüfung testen
        run: python -m unittest discover -s tools/cloudflare_checks -p 'test_ranking_launch.py' -v
      - name: Identität, Schema und freien Worker-Namen prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RANKING_CONFIRM: ${{ inputs.confirm }}
        run: python tools/cloudflare_checks/ranking_launch.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Erstmalig bereitstellen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare-ranking
        run: npx --yes wrangler@4.168.0 deploy --config wrangler.production.toml
