name: Freigegebene Archivkopie vom 22.11.2026

on:
  push:
    branches:
      - arena/99efe8f6-pflegeexamensapp
    paths:
      - .github/workflows/archive-2026-11-22-once.yml
      - tools/daily_quiz/archive_approved_once.py
      - tools/daily_quiz/test_approved_archive_once.py

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Sicherheitsprüfungen ausführen
        run: python -m unittest discover -s tools/daily_quiz -p test_approved_archive_once.py -v
      - name: Nur den freigegebenen Quiztag kopieren und vergleichen
        env:
          CONTENT_PUBLISH_TOKEN: ${{ secrets.CONTENT_PUBLISH_TOKEN }}
        run: python tools/daily_quiz/archive_approved_once.py
