name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  content-tests:
    name: Inhalts-Synchronisation testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Import und Konflikte testen
        run: python -m unittest discover -s tools/learning_import -v
      - name: Cloudflare-Bereitschaftsprüfung testen
        run: python -m unittest discover -s tools/cloudflare_checks -v
      - name: Android-Backupregeln prüfen
        run: python -m unittest discover -s tools/android_checks -v
      - name: Karteikartenimport testen
        run: |
          python -m pip install 'openpyxl>=3.1,<4'
          python -m unittest discover -s tools/card_import -v
      - name: Fall- und Quizimport testen
        run: |
          python -m unittest discover -s tools/case_import -v
          python -m unittest discover -s tools/daily_quiz -v
      - name: Node.js für Worker- und SQLite-Tests einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Testabhängigkeiten für Worker installieren
        run: |
          npm ci --prefix cloudflare-content --no-audit --no-fund
          npm ci --prefix cloudflare-ranking --no-audit --no-fund
      - name: Worker testen
        run: |
          npm test --prefix cloudflare-content
          npm test --prefix cloudflare-ranking
          python -m unittest discover -s cloudflare-ranking/test -p 'test_*.py' -v

  android-ui-tests:
    name: Android-Oberfläche im Emulator testen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: JDK 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK bereitstellen
        uses: android-actions/setup-android@v4
      - name: Hardwarebeschleunigung für Emulator aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Oberflächentests mit synthetischen Daten ausführen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            chmod +x ./gradlew
            bash -o pipefail -c './gradlew connectedDebugAndroidTest --no-daemon -PcontentUrl= -PrankingUrl= 2>&1 | tee "$RUNNER_TEMP/ui-gradle.log"'
      - name: Fehlerdiagnose für Emulator-Tests
        if: failure()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          messages = []
          log = Path(os.environ['RUNNER_TEMP']) / 'ui-gradle.log'
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  if line.startswith('e: ') or ' FAILED ' in line or ' failed.' in line:
                      messages.append(line[:1000])
          for report in Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      messages.append((case.get('name', '') + ': ' + (failure.get('message') or failure.text or 'Fehler'))[:1500])
          for message in messages[:20]:
              safe = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android-Test::' + safe)
          PYCODE
      - name: Ausführung aller Oberflächentests überprüfen
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              'shuffledCardAndAnswerSurviveSavedStateRecreation',
              'individualCardCanBeHiddenWithoutHidingOtherCards',
              'cardSearchFiltersWithoutRevealingAnswersOrUnhidingCards',
              'filteredCardSessionOnlyShowsMatchingVisibleCards',
              'cardSearchNavigationCarriesSpecialCharactersAndRestoresPicker',
              'noteOutlineJumpsToSelectedHeading',
              'caseSearchShowsMatchingDayWithoutOpeningAnswers',
              'caseAnswerOnlyAppearsWhenExplicitlyExpanded',
              'localQuizResumesAndReviewsWithoutRanking',
              'quizArchiveLoadsOnDemandAndReopensCachedDayOffline',
              'archiveExplainsWhenAnArchivedDayIsStillInTheActiveCatalog',
              'androidArchiveCacheNeverOverwritesExistingOrInterruptedFiles',
              'noteSearchJumpsToMatchAndRespectsLaterHeadingChoice',
              'noteSearchNavigatesBetweenMatchesAndKeepsSelectionAfterRestore',
              'noteSearchNavigatesToDifferentOccurrencesInsideLongParagraph',
              'noteSearchWithoutTextMatchDoesNotOfferNavigation',
              'topicSearchFindsBothVersionsAndUpdatesAfterCatalogChange',
              'androidPreferencesKeepSeparateLearningProgress',
              'malformedSyntheticPreferencesCanLookEmpty',
              'androidKeystoreProtectsTokenAndDetectsLostKey',
              'androidPendingMarkerSurvivesReopenAndNeedsMatchingServerHash',
              'pendingQuizClosureRequiresExplicitConfirmation',
              'rankedParticipationRequiresConfirmationAndRestoresAnswers',
              'rankedParticipationDoesNotReuseAnswersForChangedQuiz',
              'androidDeletionJournalSurvivesRestartAndRequiresReceipt',
              'accountDeletionNeedsConfirmationAndUncertainResultBlocksActivity',
              'recoveryRequiresOptInAndDoesNotRestoreSensitiveDialogState',
              'androidRecoveryMovesSyntheticAccessBetweenIsolatedKeystores',
          }
          found = set()
          for report in Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  if case.get('classname', '').endswith('.LearningFlowsUiTest') and case.get('name') in expected:
                      if any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')):
                          raise SystemExit('Ein Oberflächentest ist fehlgeschlagen oder wurde übersprungen.')
                      found.add(case.get('name'))
          missing = expected - found
          if missing:
              raise SystemExit('Oberflächentests fehlen im Emulatorbericht: ' + ', '.join(sorted(missing)))
          print(f'{len(found)} Oberflächentests tatsächlich ausgeführt.')
          PYCODE
      - name: Emulator-Testberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore

  build-and-test:
    name: Test & APK erstellen
    runs-on: ubuntu-latest
    env:
      # Public endpoint only; never put tokens or credentials into the APK.
      ORG_GRADLE_PROJECT_contentUrl: ${{ vars.CONTENT_URL || 'https://pflegeexamen-content.badnudin.workers.dev/content' }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Aktuellen Lernkatalog für Offline-Nutzung einbinden
        run: python tools/learning_import/bundle_published.py --url "$ORG_GRADLE_PROJECT_contentUrl"

      - name: JDK 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK bereitstellen
        uses: android-actions/setup-android@v4

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x ./gradlew

      - name: Unit-Tests ausführen
        id: unit-tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-test.log || {
            grep -E '(^e: | FAILED$| tests completed, .* failed)' /tmp/gradle-test.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            python - <<'PYCODE'
          from pathlib import Path
          lines = Path('/tmp/gradle-test.log').read_text(errors='replace').splitlines()
          relevant = [line for line in lines if any(marker in line for marker in (
              'What went wrong:', 'Could not ', 'Could not resolve', 'Execution failed',
              'Resource missing', 'FAILURE:', 'Error:', 'e: ', 'OutOfMemory', 'No space left',
              'tests completed', 'Exception:', 'Caused by:'))]
          for line in relevant[-25:]:
              safe = line[:1000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Gradle-Diagnose::' + safe)
          PYCODE
            echo "### Unit-Tests fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 /tmp/gradle-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Testberichte als Artifact hochladen
        if: always() && (steps.unit-tests.outcome == 'success' || steps.unit-tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Debug-APK bauen
        id: assemble-apk
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-assemble.log || {
            echo "### APK-Build fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 /tmp/gradle-assemble.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Unsigned Release-Build technisch prüfen
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          if PFLEGE_RELEASE_KEY_ALIAS=incomplete ./gradlew help --no-daemon >/dev/null 2>&1; then
            echo 'Unvollständige Release-Signatur wurde nicht abgelehnt.'
            exit 1
          fi

      - name: Release-Signierung mit temporärem Testschlüssel prüfen
        run: |
          set -eu
          KEYSTORE="$RUNNER_TEMP/synthetic-release.p12"
          STAGED_KEYSTORE="$RUNNER_TEMP/pflege-release-signing.keystore"
          trap 'rm -f "$KEYSTORE" "$STAGED_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 -alias test-only \
            -storepass synthetic-test -keypass synthetic-test -keyalg RSA -keysize 2048 \
            -validity 1 -dname 'CN=Synthetic CI Test' >/dev/null 2>&1
          PFLEGE_RELEASE_KEYSTORE_BASE64="$(base64 -w 0 "$KEYSTORE")" \
          PFLEGE_RELEASE_STORE_PASSWORD=synthetic-test \
          PFLEGE_RELEASE_KEY_ALIAS=test-only \
          PFLEGE_RELEASE_KEY_PASSWORD=synthetic-test \
          python tools/android_checks/prepare_release_key.py
          PFLEGE_RELEASE_KEYSTORE="$STAGED_KEYSTORE" \
          PFLEGE_RELEASE_STORE_PASSWORD=synthetic-test \
          PFLEGE_RELEASE_KEY_ALIAS=test-only \
          PFLEGE_RELEASE_KEY_PASSWORD=synthetic-test \
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          python tools/android_checks/verify_release_apk.py "$APK" app/src/main/assets/learning_content.json

      - name: Offline-Katalog in der APK prüfen
        run: |
          python - <<'PYCODE'
          import hashlib
          import zipfile
          from pathlib import Path

          original = Path('app/src/main/assets/learning_content.json').read_bytes()
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              packaged = apk.read('assets/learning_content.json')
          if packaged != original:
              raise SystemExit('Die Debug-APK enthält nicht den geprüften Offline-Katalog.')
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              release_packaged = apk.read('assets/learning_content.json')
          if release_packaged != original:
              raise SystemExit('Die Release-Test-APK enthält nicht den geprüften Offline-Katalog.')
          print('Offline-Katalog in APK geprüft: SHA-256 ' + hashlib.sha256(packaged).hexdigest())
          PYCODE

      - name: Debug-APK umbenennen
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/PflegeExamenLokal-debug.apk
          SIZE_BYTES=$(wc -c < dist-apk/PflegeExamenLokal-debug.apk)
          echo "### Build erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Unit-Tests:** erfolgreich bestanden" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug-APK:** \`PflegeExamenLokal-debug.apk\` (${SIZE_BYTES} Bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Debug-APK als Artifact bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: PflegeExamenLokal-debug-apk
          path: dist-apk/PflegeExamenLokal-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release bei Tag (v*) erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-apk/PflegeExamenLokal-debug.apk
