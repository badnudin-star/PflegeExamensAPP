name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  content-tests:
    name: Inhalts-Synchronisation testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Import und Konflikte testen
        run: python -m unittest discover -s tools/learning_import -v
      - name: Karteikartenimport testen
        run: |
          python -m pip install 'openpyxl>=3.1,<4'
          python -m unittest discover -s tools/card_import -v
      - name: Fall- und Quizimport testen
        run: |
          python -m unittest discover -s tools/case_import -v
          python -m unittest discover -s tools/daily_quiz -v
      - name: Worker testen
        run: |
          npm test --prefix cloudflare-content
          npm test --prefix cloudflare-ranking
          python -m unittest discover -s cloudflare-ranking/test -p 'test_*.py' -v

  android-ui-tests:
    name: Android-Oberfläche im Emulator testen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: JDK 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK bereitstellen
        uses: android-actions/setup-android@v4
      - name: Hardwarebeschleunigung für Emulator aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Oberflächentests mit synthetischen Daten ausführen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: chmod +x ./gradlew && ./gradlew connectedDebugAndroidTest --no-daemon -PcontentUrl= -PrankingUrl=
      - name: Ausführung aller Oberflächentests überprüfen
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              'shuffledCardAndAnswerSurviveSavedStateRecreation',
              'individualCardCanBeHiddenWithoutHidingOtherCards',
              'noteOutlineJumpsToSelectedHeading',
              'caseSearchShowsMatchingDayWithoutOpeningAnswers',
          }
          found = set()
          for report in Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  if case.get('classname', '').endswith('.LearningFlowsUiTest') and case.get('name') in expected:
                      if any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')):
                          raise SystemExit('Ein Oberflächentest ist fehlgeschlagen oder wurde übersprungen.')
                      found.add(case.get('name'))
          missing = expected - found
          if missing:
              raise SystemExit('Oberflächentests fehlen im Emulatorbericht: ' + ', '.join(sorted(missing)))
          print(f'{len(found)} Oberflächentests tatsächlich ausgeführt.')
          PYCODE
      - name: Emulator-Testberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore

  build-and-test:
    name: Test & APK erstellen
    runs-on: ubuntu-latest
    env:
      # Public endpoint only; never put tokens or credentials into the APK.
      ORG_GRADLE_PROJECT_contentUrl: ${{ vars.CONTENT_URL || 'https://pflegeexamen-content.badnudin.workers.dev/content' }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Aktuellen Lernkatalog für Offline-Nutzung einbinden
        run: python tools/learning_import/bundle_published.py --url "$ORG_GRADLE_PROJECT_contentUrl"

      - name: JDK 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK bereitstellen
        uses: android-actions/setup-android@v4

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x ./gradlew

      - name: Unit-Tests ausführen
        id: unit-tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-test.log || {
            grep -E '(^e: | FAILED$| tests completed, .* failed)' /tmp/gradle-test.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "### Unit-Tests fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 /tmp/gradle-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Testberichte als Artifact hochladen
        if: always() && (steps.unit-tests.outcome == 'success' || steps.unit-tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Debug-APK bauen
        id: assemble-apk
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-assemble.log || {
            echo "### APK-Build fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 /tmp/gradle-assemble.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Offline-Katalog in der APK prüfen
        run: |
          python - <<'PYCODE'
          import hashlib
          import zipfile
          from pathlib import Path

          original = Path('app/src/main/assets/learning_content.json').read_bytes()
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              packaged = apk.read('assets/learning_content.json')
          if packaged != original:
              raise SystemExit('Die APK enthält nicht den geprüften Offline-Katalog.')
          print('Offline-Katalog in APK geprüft: SHA-256 ' + hashlib.sha256(packaged).hexdigest())
          PYCODE

      - name: Debug-APK umbenennen
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/PflegeExamenLokal-debug.apk
          SIZE_BYTES=$(wc -c < dist-apk/PflegeExamenLokal-debug.apk)
          echo "### Build erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Unit-Tests:** erfolgreich bestanden" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug-APK:** \`PflegeExamenLokal-debug.apk\` (${SIZE_BYTES} Bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Debug-APK als Artifact bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: PflegeExamenLokal-debug-apk
          path: dist-apk/PflegeExamenLokal-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release bei Tag (v*) erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-apk/PflegeExamenLokal-debug.apk
