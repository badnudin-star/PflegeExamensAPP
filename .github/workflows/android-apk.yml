name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test & APK erstellen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK bereitstellen
        uses: android-actions/setup-android@v3

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x ./gradlew

      - name: Unit-Tests ausführen
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Testberichte als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --no-daemon

      - name: Debug-APK umbenennen
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/PflegeExamenLokal-debug.apk

      - name: Debug-APK als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PflegeExamenLokal-debug-apk
          path: dist-apk/PflegeExamenLokal-debug.apk
          retention-days: 30

      - name: GitHub Release bei Tag (v*) erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/PflegeExamenLokal-debug.apk
