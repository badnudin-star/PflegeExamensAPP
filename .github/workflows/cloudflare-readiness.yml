name: Cloudflare-Bereitschaft schreibgeschützt prüfen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Selbsttest der Prüfung
        run: |
          python -m pip install -r tools/cloudflare_checks/requirements-backup.txt
          python -m unittest discover -s tools/cloudflare_checks -v
      - name: Cloudflare-Berechtigungen und Inhalts-Binding lesen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/cloudflare_checks/readiness.py
