name: Signiertes App-Update im Emulator prüfen
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Nur künstliche Testdaten im frischen Emulator verwenden'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ursprung der beiden signierten APKs prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          for run in 45679172926 45705602283; do
            gh api "repos/$REPO/actions/runs/$run" | jq -e --arg repo "$REPO" '
              .repository.full_name == $repo and .head_repository.full_name == $repo and
              .path == ".github/workflows/internal-release.yml" and .head_branch == "main" and
              .event == "workflow_dispatch" and .conclusion == "success"
            ' >/dev/null
          done
      - name: Version 3.0.4 herunterladen
        uses: actions/download-artifact@v8
        with:
          name: PflegeExamen-intern-signiert
          path: ${{ runner.temp }}/old-apk
          github-token: ${{ github.token }}
          run-id: 45679172926
      - name: Version 3.0.5 herunterladen
        uses: actions/download-artifact@v8
        with:
          name: PflegeExamen-intern-signiert
          path: ${{ runner.temp }}/new-apk
          github-token: ${{ github.token }}
          run-id: 45705602283
      - uses: android-actions/setup-android@v4
      - name: Version und öffentliches Signaturzertifikat prüfen
        run: |
          set -eu
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          printf '%s\n' 'Signer #1 certificate SHA-256 digest: 131ca778b5fac3e9d0cb30b3b49b6db476ed7745572f3c038805952672967425' > "$RUNNER_TEMP/expected-cert.txt"
          for version in old new; do
            APK="$RUNNER_TEMP/$version-apk/app-release.apk"
            "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/$version-certs.txt"
            python tools/android_checks/compare_release_certificates.py "$RUNNER_TEMP/expected-cert.txt" "$RUNNER_TEMP/$version-certs.txt"
          done
          "$AAPT" dump badging "$RUNNER_TEMP/old-apk/app-release.apk" | grep -F "package: name='de.pflegeexamen.app' versionCode='15' versionName='3.0.4'"
          "$AAPT" dump badging "$RUNNER_TEMP/new-apk/app-release.apk" | grep -F "package: name='de.pflegeexamen.app' versionCode='16' versionName='3.0.5'"
      - name: Hardwarebeschleunigung für Emulator aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline-Update mit künstlichen Daten prüfen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/android_checks/upgrade_smoke.sh "$RUNNER_TEMP/old-apk/app-release.apk" "$RUNNER_TEMP/new-apk/app-release.apk"
