name: Android-Rangliste live im Emulator prüfen
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Öffentlichen Ranglisten-Lesezugriff im Emulator testen'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  live:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Hardwarebeschleunigung für Emulator aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Nur manuellen Live-Test in Arbeitskopie einfügen
        run: |
          mkdir -p app/src/androidTest/java/de/pflegeexamen/app/integration
          cp tools/android_checks/RankingLiveNetworkTest.kt app/src/androidTest/java/de/pflegeexamen/app/integration/
      - name: Android-Transport gegen öffentlichen Dienst testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            chmod +x ./gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=de.pflegeexamen.app.integration.RankingLiveNetworkTest
      - name: Ausführung des Live-Tests bestätigen
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = [case for path in Path('app/build/outputs/androidTest-results/connected').rglob('*.xml')
                   for case in ET.parse(path).iter('testcase')
                   if case.get('classname') == 'de.pflegeexamen.app.integration.RankingLiveNetworkTest'
                   and case.get('name') == 'publicRankingLoadsUsingTheActualAndroidTransport']
          if len(cases) != 1 or any(cases[0].find(k) is not None for k in ('failure', 'error', 'skipped')):
              raise SystemExit('Live-Test nicht eindeutig erfolgreich ausgeführt.')
          print('Android-Ranglisten-Lesetest ausgeführt.')
          PY
      - name: Testergebnisse bereitstellen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ranking-android-live-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
