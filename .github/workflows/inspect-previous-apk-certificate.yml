name: Öffentliches Zertifikat der vorherigen internen APK prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Vorheriges signiertes Artifact herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45343367864 --name PflegeExamen-intern-signiert --dir "$RUNNER_TEMP/previous-release"
      - name: Nur öffentliche Zertifikatszeilen ausgeben
        run: |
          set -eu
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/previous-release/app-release.apk" > "$RUNNER_TEMP/public-cert.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'public-cert.txt').read_text()
          lines = [line for line in text.splitlines() if 'certificate SHA-256' in line]
          print('::notice title=Zertifikat-Zeilen::' + str(len(lines)))
          for line in lines[:3]:
              print('::notice title=Öffentliche Zertifikatszeile::' + line.replace('%', '%25'))
          PY
