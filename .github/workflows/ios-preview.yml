name: iOS-Vorschau bauen

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-preview.yml'
      - 'tools/learning_import/**'
      - 'app/src/main/assets/learning_content.json'
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-preview.yml'
      - 'tools/learning_import/**'
      - 'app/src/main/assets/learning_content.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: iOS-Simulatorvorschau (nicht signiert)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Öffentlichen Offline-Katalog validieren
        run: |
          python3 tools/learning_import/bundle_published.py --url https://pflegeexamen-content.badnudin.workers.dev/content
          cp app/src/main/assets/learning_content.json ios/PflegeExamen/learning_content.json
          mkdir -p ios/PflegeExamen/note_pdfs
          echo '{}' > ios/PflegeExamen/note_pdfs/manifest.json
      - name: Katalog einlesen und ungültiges Schema ablehnen
        run: |
          set -o pipefail
          swiftc ios/PflegeExamen/Catalog.swift ios/PflegeExamen/CatalogStore.swift ios/PflegeExamen/ProgressStore.swift ios/PflegeExamen/NotePDFLocator.swift ios/PflegeExamen/Ranking.swift ios/PflegeExamen/QuizArchive.swift ios/Tests/CatalogSmoke.swift -o "$RUNNER_TEMP/catalog-smoke" 2>&1 | tee "$RUNNER_TEMP/swift-smoke.log" || {
            python3 -c 'import pathlib,sys; lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines(); print("::error title=Swift test build::" + " | ".join(lines[-12:]).replace("%", "%25"))' "$RUNNER_TEMP/swift-smoke.log"
            exit 1
          }
          "$RUNNER_TEMP/catalog-smoke" ios/PflegeExamen/learning_content.json app/src/debug/assets/private/note_pdfs
      - name: Vorschau für iOS-Simulator bauen
        run: |
          set -o pipefail
          xcodebuild -project ios/PflegeExamen.xcodeproj -scheme PflegeExamen -configuration Debug \
            -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" || {
              python3 -c 'import pathlib,sys; lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines(); matches=[x for x in lines if "error:" in x.lower()]; print("::error title=Xcode build::" + (" | ".join(matches[-8:]) or "Build failed; see job log").replace("%", "%25"))' "$RUNNER_TEMP/xcodebuild.log"
              exit 1
          }
      - name: Vorschau auf einem iPhone-Simulator starten
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in sorted(d["devices"].items(), reverse=True) if "iOS" in runtime for x in devices if x["name"].startswith("iPhone") and x["isAvailable"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/PflegeExamen.app"
          xcrun simctl launch "$DEVICE" de.pflegeexamen.ios.preview
      - name: Nicht signierte Simulator-App verpacken
        run: |
          cd "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent PflegeExamen.app "$RUNNER_TEMP/PflegeExamen-iOS-Simulator-Vorschau.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: PflegeExamen-iOS-Simulator-Vorschau-NICHT-installierbar
          path: ${{ runner.temp }}/PflegeExamen-iOS-Simulator-Vorschau.zip
          if-no-files-found: error
          retention-days: 7

  iphone-ipa:
    name: Nicht signierte iPhone-IPA-Vorschau für SideStore
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Paketprüfung testen
        run: python3 -m unittest discover -s ios/tools -v
      - name: Öffentlichen Offline-Katalog validieren
        run: |
          python3 tools/learning_import/bundle_published.py --url https://pflegeexamen-content.badnudin.workers.dev/content
          cp app/src/main/assets/learning_content.json ios/PflegeExamen/learning_content.json
      - name: Öffentliche Original-PDFs prüfen und einbinden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-env"
          "$RUNNER_TEMP/pdf-env/bin/pip" install 'pypdf>=5,<7'
          gh release download v3.0.8 --repo badnudin-star/PflegeExamensAPP \
            --pattern PflegeExamen-vc19.apk --dir "$RUNNER_TEMP"
          "$RUNNER_TEMP/pdf-env/bin/python" ios/tools/bundle_public_apk_pdfs.py \
            "$RUNNER_TEMP/PflegeExamen-vc19.apk" ios/PflegeExamen/learning_content.json ios/PflegeExamen/note_pdfs
      - name: Vorschau für iPhone-Geräte bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild -project ios/PflegeExamen.xcodeproj -scheme PflegeExamen -configuration Release \
            -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/ios-device" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/xcode-device.log" || {
              python3 -c 'import pathlib,sys; lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines(); matches=[x for x in lines if "error:" in x.lower()]; print("::error title=iPhone build::" + (" | ".join(matches[-8:]) or "Build failed; see job log").replace("%", "%25"))' "$RUNNER_TEMP/xcode-device.log"
              exit 1
          }
      - name: IPA verpacken und Struktur prüfen
        run: |
          mkdir "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/ios-device/Build/Products/Release-iphoneos/PflegeExamen.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/PflegeExamen-iOS-SideStore-Vorschau.ipa"
          python3 ios/tools/verify_ipa.py "$RUNNER_TEMP/PflegeExamen-iOS-SideStore-Vorschau.ipa" ios/PflegeExamen/note_pdfs
          shasum -a 256 "$RUNNER_TEMP/PflegeExamen-iOS-SideStore-Vorschau.ipa"
          # Synthetic URLs: validate source generation only; never upload or publish this draft.
          python3 ios/tools/make_sidestore_source.py --ipa "$RUNNER_TEMP/PflegeExamen-iOS-SideStore-Vorschau.ipa" \
            --ipa-url https://example.org/test.ipa --icon-url https://example.org/test.png \
            --date 2026-01-01 --output "$RUNNER_TEMP/synthetic-source.json"
      - uses: actions/upload-artifact@v7
        with:
          name: PflegeExamen-iOS-SideStore-IPA-Vorschau-UNSIGNIERT
          path: ${{ runner.temp }}/PflegeExamen-iOS-SideStore-Vorschau.ipa
          if-no-files-found: error
          retention-days: 7
