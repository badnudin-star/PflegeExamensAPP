name: App-Update öffentlich veröffentlichen
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run-ID des erfolgreichen internen APK-Builds vom aktuellen main'
        required: true
        type: string
      confirm_public:
        description: 'APK samt enthaltenen Lernzettel-PDFs öffentlich veröffentlichen; Rechte geprüft'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-app-update
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_public == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Bestätigten internen Build identifizieren
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          case "$RUN_ID" in ''|*[!0-9]*) echo 'Ungültige Run-ID'; exit 1;; esac
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/internal-run.json"
          python tools/android_checks/check_update_release.py "$RUNNER_TEMP/internal-run.json" "$GITHUB_SHA" app/build.gradle.kts "$GITHUB_OUTPUT"
          gh run download "$RUN_ID" --name PflegeExamen-intern-signiert --dir "$RUNNER_TEMP/release-apk"
      - name: APK-Signatur, Identität und Version erneut prüfen
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ASSET_NAME: ${{ steps.version.outputs.asset }}
        run: |
          set -eu
          APK="$RUNNER_TEMP/release-apk/app-release.apk"
          test -f "$APK"
          test "$(stat -c %s "$APK")" -le 209715200
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/current-certs.txt"
          printf '%s\n' 'Signer #1 certificate SHA-256 digest: 131ca778b5fac3e9d0cb30b3b49b6db476ed7745572f3c038805952672967425' > "$RUNNER_TEMP/expected-cert.txt"
          python tools/android_checks/compare_release_certificates.py "$RUNNER_TEMP/expected-cert.txt" "$RUNNER_TEMP/current-certs.txt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='de.pflegeexamen.app' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          cp "$APK" "$RUNNER_TEMP/$ASSET_NAME"
      - name: Öffentliches Release nach ausdrücklicher Bestätigung erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET_NAME: ${{ steps.version.outputs.asset }}
        run: |
          set -eu
          existing=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$existing" ]; then echo 'Tag existiert bereits; kein Release verändert.'; exit 1; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
          tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.type)
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)
          test "$tag_type" = commit && test "$tag_sha" = "$GITHUB_SHA"
          gh release create "$TAG" "$RUNNER_TEMP/$ASSET_NAME" --verify-tag --draft --title "PflegeExamen $TAG" --notes 'Signiertes App-Update. Enthält Lernzettel-PDFs und ist öffentlich herunterladbar. App als Update installieren, nicht deinstallieren.'
          gh release edit "$TAG" --draft=false --latest
