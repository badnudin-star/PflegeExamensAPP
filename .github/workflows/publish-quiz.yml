name: Geprüftes Tagesquiz veröffentlichen
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub-Actions-Laufnummer des geprüften Entwurfs
        required: true
        type: string
      sha256:
        description: SHA-256 der fachlich geprüften quiz-draft.json
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: learning-content-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Entwurf herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$RUN_ID" --name tagesquiz-entwurf --dir "$RUNNER_TEMP/quiz"
      - name: Abhängigkeiten installieren
        run: pip install -r tools/learning_import/requirements.txt
      - name: Geprüften Entwurf konfliktgeschützt veröffentlichen
        env:
          HASH: ${{ inputs.sha256 }}
          CONTENT_WORKER_ORIGIN: ${{ vars.CONTENT_WORKER_ORIGIN }}
          CONTENT_PUBLISH_TOKEN: ${{ secrets.CONTENT_PUBLISH_TOKEN }}
        run: python tools/daily_quiz/quiz_pipeline.py publish --draft "$RUNNER_TEMP/quiz/quiz-draft.json" --sha256 "$HASH" --worker "$CONTENT_WORKER_ORIGIN"
