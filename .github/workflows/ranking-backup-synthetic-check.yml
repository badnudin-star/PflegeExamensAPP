name: Verschlüsselte Ranking-Sicherung isoliert prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verschlüsselungsabhängigkeit installieren
        run: python -m pip install -r tools/cloudflare_checks/requirements-backup.txt
      - name: Schutz und Verschlüsselung testen
        run: python -m unittest discover -s tools/cloudflare_checks -p 'test_ranking_backup.py' -v
      - name: Ausschließlich synthetische Test-D1 lesen und Sicherung prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/cloudflare_checks/ranking_backup_synthetic.py
