name: Quiz-Testentwurf technisch prüfen
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Laufnummer des einmaligen Quiztests
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Testentwurf herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          umask 077
          gh run download "$RUN_ID" --name tagesquiz-test-nicht-veroeffentlichen --dir "$RUNNER_TEMP/quiz-test"
      - name: Nur technische Hinweise ausgeben
        run: python tools/daily_quiz/review_checks.py "$RUNNER_TEMP/quiz-test/quiz-draft.json"
