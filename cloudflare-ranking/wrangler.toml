name = "pflege-examen-ranking"
main = "src/worker.js"
compatibility_date = "2025-11-01"

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pflege_ranking_db"
# Nach `npx wrangler d1 create pflege_ranking_db` hier deine erhaltene UUID eintragen:
database_id = "DEINE_D1_DATABASE_ID_HIER"

# Öffentlicher Inhaltsendpunkt, wird bei späterer Einrichtung gesetzt.
# [vars]
# QUIZ_CATALOG_URL = "https://pflegeexamen-content.badnudin.workers.dev/content"

# Beispielhafte Grenzwerte pro Cloudflare-Standort. Namespace-IDs müssen vor
# Deployment im Konto eindeutig sein; Limitierung ist näherungsweise, nicht global.
[[ratelimits]]
name = "REGISTRATION_RATE"
namespace_id = "74001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "READ_RATE"
namespace_id = "74002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "AUTH_RATE"
namespace_id = "74003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ACCOUNT_RATE"
namespace_id = "74004"
simple = { limit = 20, period = 60 }
